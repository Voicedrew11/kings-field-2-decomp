# Explicit reconstruction build units. Compiler profiles are named probes until
# the historical compiler and flags are proven.

[profiles.probe-gcc260-o2-g0]
language = "c"
compiler = "gcc260-native"
optimization = "O2"
small_data = 0
aspsx_version = "1.07"
cc1_flags = []

# The 3.0 kit's own CC1PSX (GCC 2.4.1) under DOSBox; a probe, not provenance,
# and no unit selects it. Whole GAME units score below 2.5.7 (see
# docs/kf2-toolchain-and-lineage.md), but it reproduces some retail loop
# motion and allocation that 2.5.7 cannot.
[profiles.probe-gcc241-kit-o2-r2000]
language = "c"
compiler = "gcc241-kit"
optimization = "O2"
small_data = 0
aspsx_version = "1.07"
cc1_flags = ["-mcpu=r2000"]

# GCC 2.5.7 probe. Its text epilogue (`lw $31; nop; j $31; addu $sp`), load
# hoisting above the frame allocation, and -O2 schedule reproduce retail forms
# that the 2.6.0 probe cannot emit. Native ASPSX supplies the checked
# div/rem expansion (`break 7`/`break 6`) that retail contains. Still a probe.
# The selected `-mcpu=r2000` scheduling model reproduces retail argument setup
# and load placement in ten additional units without regressions. The original
# compiler and CPU flag remain unproven.
[profiles.probe-gcc257-o2-g0]
language = "c"
compiler = "gcc257-native"
optimization = "O2"
small_data = 0
aspsx_version = "1.07"
cc1_flags = ["-mcpu=r2000"]

# Per-unit CSE traversal control. It reproduces the separately materialized
# player-height address loads in one GAME leaf; this is not compiler provenance.
[profiles.probe-gcc257-o2-no-cse-skip-blocks]
language = "c"
compiler = "gcc257-native"
optimization = "O2"
small_data = 0
aspsx_version = "1.07"
cc1_flags = ["-mcpu=r2000", "-fno-cse-skip-blocks"]

# Initialized small-data probe; native actor code remains identical to G0.
[profiles.probe-gcc257-o2-g8]
language = "c"
compiler = "gcc257-native"
optimization = "O2"
small_data = 8
aspsx_version = "1.07"
cc1_flags = ["-mcpu=r2000"]

[profiles.probe-gcc257-o2-plain]
language = "c"
compiler = "gcc257-native"
optimization = "O2"
small_data = 0
aspsx_version = "1.07"
cc1_flags = []

# Native private-small-BSS probe for the SDK PAD verification sources.
[profiles.probe-gcc257-o2-plain-g8]
language = "c"
compiler = "gcc257-native"
optimization = "O2"
small_data = 8
aspsx_version = "1.07"
cc1_flags = []

# Per-TU scheduling-model probes. `-mcpu=r2000` (the default g0) is a per-unit
# discriminator, not a global truth: some TUs reach byte-exact only under a
# different R3000A scheduling model. `-fno-schedule-insns` disables the cc1
# instruction scheduler and reproduces retail's unscheduled load placement for
# the units that were compiled that way. These remain probes.
[profiles.probe-gcc257-o2-nosched]
language = "c"
compiler = "gcc257-native"
optimization = "O2"
small_data = 0
aspsx_version = "1.07"
cc1_flags = ["-mcpu=r2000", "-fno-schedule-insns"]

[profiles.asm-r3000-g0]
language = "assembly"
compiler = "aspsx"
small_data = 0
aspsx_version = "1.07"
cc1_flags = []

